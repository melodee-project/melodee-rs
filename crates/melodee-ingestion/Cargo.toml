[package]
name = "melodee-ingestion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Durable inbound processing pipeline: acquisition, inspection, normalization, validation, and publication"
publish = false

[features]
test-support = []

[dependencies]
blake3.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
futures-util.workspace = true
melodee-domain = { path = "../melodee-domain", version = "0.3.0" }
melodee-persistence = { path = "../melodee-persistence", version = "0.3.0" }
melodee-media = { path = "../melodee-media", version = "0.3.0" }
thiserror.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { workspace = true, features = ["process", "std"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
