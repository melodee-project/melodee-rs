# pnpm 11 build-script policy (same mechanism as docs/pnpm-workspace.yaml).
# An explicit `false` is important: CI enables strict ignored-build handling,
# so an omitted Carbon or IBM Plex dependency would make a fresh install fail.
# These packages ship prebuilt assets; their postinstall scripts are not needed
# by the admin UI. Only the two tools below may execute install scripts.
allowBuilds:
  '@carbon/colors': false
  '@carbon/feature-flags': false
  '@carbon/grid': false
  '@carbon/icon-helpers': false
  '@carbon/icons-react': false
  '@carbon/layout': false
  '@carbon/motion': false
  '@carbon/react': false
  '@carbon/styles': false
  '@carbon/themes': false
  '@carbon/type': false
  '@carbon/utilities': false
  '@ibm/plex': false
  '@ibm/plex-mono': false
  '@ibm/plex-sans': false
  '@ibm/plex-sans-arabic': false
  '@ibm/plex-sans-devanagari': false
  '@ibm/plex-sans-hebrew': false
  '@ibm/plex-sans-thai': false
  '@ibm/plex-sans-thai-looped': false
  '@ibm/plex-serif': false
  '@parcel/watcher': true
  esbuild: true
