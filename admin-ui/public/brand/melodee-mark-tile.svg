<?xml version="1.0" encoding="UTF-8"?>
<!--
  Melodee brand monogram tile (ADR-0184).

  The reference shell leads with a small rounded gradient tile carrying a white
  "M", followed by the `melodee` wordmark and an `ADMIN` micro-label. This asset
  is that tile at both rail widths, so the brand reads identically expanded and
  collapsed. Pure SVG: no raster, no external font dependency (the glyph is a
  stroked path so it renders the same everywhere).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="presentation" focusable="false">
  <defs>
    <linearGradient id="melodee-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="0.55" stop-color="#0f62fe"/>
      <stop offset="1" stop-color="#0b3fbf"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#melodee-tile)"/>
  <path
    d="M9 23V9.5l7 6.6 7-6.6V23"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
