  <title id="title">Melodee Carbon neutrals and semantic color</title>
  <desc id="desc">Neutral, semantic, and data visualization color guidance.</desc>
  <defs>
    <linearGradient id="neutral-spectrum" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="860" y2="0">
      <stop offset="0" stop-color="#FF2DBD"/><stop offset=".18" stop-color="#FF4F87"/>
      <stop offset=".34" stop-color="#FF6A00"/><stop offset=".49" stop-color="#FFD600"/>
      <stop offset=".65" stop-color="#00E0C6"/><stop offset=".82" stop-color="#4DA7FF"/>
      <stop offset="1" stop-color="#B14DFF"/>
    </linearGradient>
    <linearGradient id="neutral-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".22" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".65" stop-color="#000" stop-opacity=".03"/>
      <stop offset="1" stop-color="#000" stop-opacity=".28"/>
