[workspace]
resolver = "3"
members = [
  "apps/melodee-cli",
  "apps/melodee-server",
  "crates/melodee-auth",
  "crates/melodee-catalog",
  "crates/melodee-domain",
  "crates/melodee-persistence",
  "crates/melodee-ingestion",
  "crates/melodee-media",
  "crates/melodee-policy",
  "crates/melodee-mql",
  "crates/melodee-search",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
authors = ["Melodee Project contributors"]

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["http1", "json", "multipart", "tokio"] }
base64 = "=0.23.1"
bcrypt = "=0.19.3"
# ADR-0135: Boa is the scripting-hook ECMAScript runtime — pure Rust, no C
# toolchain, capability-less sandbox (nothing host-provided is registered).
# boa_engine 0.22.0, Unlicense OR MIT, boa-dev/boa. Default
# features off: float16 (Float16Array) and xsum (precision summation) are not
# needed by the hook contract; the serde_json JsValue bridge is unconditional
# in 0.22.x. No intl/temporal: no ICU4X linkage for operator predicates.
boa_engine = { version = "=0.22.0", default-features = false }
blake3 = "=1.8.7"
# ADR-0179 (supersedes ADR-0168): read-only MusicBrainz local-replica access uses the pinned
# Apache-2.0 DecentDB engine used by the legacy export format. Default Lua
# extensions are disabled; Melodee only needs bounded SQL reads.
decentdb = { git = "https://github.com/sphildreth/decentdb.git", rev = "b15ee763def5d696feb07d3ff29d467b7914a603", version = "=2.17.2", default-features = false }
dotenvy = "=0.15.7"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
hmac = "=0.13.0"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
# PRD-NOTIF-002: FOSS SMTP transport for notification delivery.
# lettre 0.11.23, MIT, lettre/lettre; no hosted service, no broker. rustls
# TLS only (no native-tls/OpenSSL linkage) on the tokio1 executor; default
# features off so no connection pool, sendmail, or file transport is linked.
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }
# ADR-0130: OpenSubsonic token+salt authentication is defined by the protocol
# as md5(secret + salt); the digest is a frozen wire contract, not a security
# primitive. RustCrypto md-5, MIT/Apache-2.0.
md-5 = "=0.11.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
# ADR-0134 §7 (amended 2026-08-14): ChaCha20-Poly1305 AEAD sealing of
# Last.fm session keys at rest. ring 0.17.14 is already in the dependency
# tree via rustls (Apache-2.0 AND ISC); making it a direct dependency adds
# no new transitive crates to the lockfile.
ring = "=0.17.14"
# ADR-0122 resource bounds make MQL a security-relevant parser surface, so it
# gets property-based tests (AGENTS.md testing requirements). proptest 1.11.0,
# MIT OR Apache-2.0, test-only (dev-dependency; never linked into production
# binaries). Default features off: fork/timeout (rusty-fork child processes)
# and bit-set are not needed; "std" is the minimal complete feature set.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
quick-xml = "=0.42.0"
tempfile = "=3.27.0"
clap = { version = "=4.6.7", features = ["derive", "env"] }
serde = { version = "=1.0.229", features = ["derive"] }
# preserve_order keeps insertion order in serde_json::Value so OpenSubsonic
# JSONP bodies serialize byte-compatibly with the frozen captures.
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha2 = "=0.11.0"
# ADR-0147 decision 2: splits configured FFmpeg command templates into argv
# arrays under shell-words rules without invoking a shell. Already present in
# the lockfile as a build-only transitive dependency (jobserver); promoting it
# to a direct dependency of melodee-server adds no new crate to the tree.
shlex = "=2.0.1"
# ADR-0123: bounded native image compatibility. Enable only codecs accepted
# by the native upload/capture contract; no AVIF, BMP, DDS, EXR, HDR, ICO,
# PNM, QOI, TIFF, or TGA decoder is linked.
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lofty = "=0.25.4"
# ADR-0116: safe no-replace directory finalization for canonical publication
# on Unix. Windows uses the platform's non-replacing rename behavior.
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std"] }
# ADR-0110: SQLx with explicit SQL against PostgreSQL. Runtime-checked queries
# for now; compile-time/offline query metadata is a later hardening step.
sqlx = { version = "=0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "time",
  "uuid",
] }
# ADR-0107 (Tantivy as rebuildable search projection) + ADR-0121 (search
# projection schema and lifecycle). Exact pin recorded in the frozen baseline
# revalidation: tantivy 0.26.1 (2026-04-21), MIT, quickwit-oss, no commercial
# feature boundary. Unicode-aware simple/lowercase/ASCII-fold tokenizers are
# used; no proprietary Tantivy features are enabled.
tantivy = "=0.26.2"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "serde"] }
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["cors", "fs", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "=1.27.0", features = ["serde", "v7"] }
# ADR-0123: bounded in-memory native-v1 theme-pack import/export. Only the
# standard DEFLATE codec is enabled; encrypted and exotic archive codecs are
# intentionally outside the compatibility boundary.
zip = { version = "=9.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
# Lower priority so the deny-level lints below override the group.
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.coverage]
inherits = "dev"
codegen-units = 1
debug = 2
debug-assertions = true
panic = "unwind"
