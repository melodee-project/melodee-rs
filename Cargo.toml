[workspace]
resolver = "3"
members = [
  "apps/melodee-cli",
  "apps/melodee-server",
  "crates/melodee-catalog",
  "crates/melodee-domain",
  "crates/melodee-persistence",
  "crates/melodee-ingestion",
  "crates/melodee-media",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Melodee Project contributors"]

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["http1", "json", "tokio"] }
blake3 = "=1.8.6"
clap = { version = "=4.6.4", features = ["derive", "env"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
lofty = "=0.25.0"
# ADR-0116: safe no-replace directory finalization for canonical publication
# on Unix. Windows uses the platform's non-replacing rename behavior.
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
# ADR-0110: SQLx with explicit SQL against PostgreSQL. Runtime-checked queries
# for now; compile-time/offline query metadata is a later hardening step.
sqlx = { version = "=0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "time",
  "uuid",
] }
thiserror = "=2.0.19"
time = { version = "=0.3.55", features = ["serde"] }
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "=0.7.0", features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "=1.24.0", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
# Lower priority so the deny-level lints below override the group.
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
