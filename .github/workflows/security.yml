name: Security scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Gitleaks is an open-source scanner. The repository config permits only
      # exact, deliberately synthetic fixture paths; all other source and
      # documentation remains fail-closed.
      - name: Scan repository contents for secrets
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/repo:ro"
          zricethezav/gitleaks:v8.30.0
          dir /repo --redact --no-banner --log-level error
