name: Admin UI

on:
  push:
    branches: [main]
    paths:
      - admin-ui/**
      - scripts/harvest_legacy_i18n.py
      - .github/workflows/admin-ui.yml
  pull_request:
    paths:
      - admin-ui/**
      - scripts/harvest_legacy_i18n.py
      - .github/workflows/admin-ui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: admin-ui/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: admin-ui

      - name: Static gates
        run: pnpm check && pnpm lint && pnpm i18n:check
        working-directory: admin-ui

      - name: Unit tests
        run: pnpm test
        working-directory: admin-ui

      - name: Build
        run: pnpm build
        working-directory: admin-ui

      - name: Audit all dependencies
        run: pnpm audit
        working-directory: admin-ui

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: admin-ui/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: admin-ui

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: admin-ui

      - name: E2E and visual tests
        run: pnpm test:e2e
        working-directory: admin-ui

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: admin-ui/playwright-report
          retention-days: 7
