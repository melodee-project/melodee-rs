name: CI (fast checks)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Keep the broad compile/lint pass lean. The full workflow uses the same
  # settings while linking every integration-test binary.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  validate:
    name: Fast validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Clippy compiles all targets, so release optional hosted-runner tools
      # before building. Never alter these paths on a self-hosted runner.
      - name: Free GitHub-hosted runner disk space
        if: runner.environment == 'github-hosted'
        run: sudo -E python3 scripts/ci_tasks.py free-space
        env:
          MELODEE_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      - name: Install pinned Rust toolchain
        run: python3 scripts/ci_tasks.py toolchain
      - name: Show tool versions
        run: python3 scripts/ci_tasks.py versions
      # The fast gate runs the media crate's library suite, which creates
      # fixtures with ffmpeg and inspects them with ffprobe. Keep the runner
      # environment faithful to that executable contract.
      - name: Install media inspection tools
        run: python3 scripts/ci_tasks.py media-tools
      - name: Run fast gate
        run: python3 scripts/check.py fast
