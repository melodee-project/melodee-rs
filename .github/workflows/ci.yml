name: CI (smoke)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Keep the broad compile/lint pass lean. The full workflow uses the same
  # settings while linking every integration-test binary.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  validate:
    name: Smoke validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Clippy compiles all targets, so release optional hosted-runner tools
      # before building. Never alter these paths on a self-hosted runner.
      - name: Free GitHub-hosted runner disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          python3 --version

      - name: Run smoke gate
        run: ./scripts/check-smoke.sh
