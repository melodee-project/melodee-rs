name: Docs

# Builds and validates the Astro Starlight documentation site under /docs on
# every relevant pull request. When the repository supports GitHub Pages and
# the MELODEE_PAGES_ENABLED repository variable is true, pushes to main also
# deploy it.
#
# To enable deployment, configure Pages with "Source: GitHub Actions" and set
# the repository variable MELODEE_PAGES_ENABLED=true. DOCS_SITE/DOCS_BASE
# below match the default project Pages URL; for a custom domain set DOCS_SITE
# to that domain, DOCS_BASE to '/', and commit docs/public/CNAME.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DOCS_SITE: https://melodee-project.github.io
  DOCS_BASE: /melodee-rs

# Only one Pages deployment at a time; queued runs are not cancelled so a
# newer commit always publishes after the current one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Version comes from the packageManager field (pnpm 12.x).
          package_json_file: docs/package.json
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate content, types, and links
        run: |
          pnpm check
          pnpm check:links

      - name: Audit all dependencies
        run: pnpm audit

      - name: Build site
        run: pnpm build

      - name: Configure Pages
        if: github.event_name != 'pull_request' && vars.MELODEE_PAGES_ENABLED == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.MELODEE_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && vars.MELODEE_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
