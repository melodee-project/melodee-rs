name: Full validation

# The release-grade suite exercises real PostgreSQL, FFmpeg/fpcalc, the full
# compatibility corpus, every Rust integration test, UI static checks, and
# dependency policy. Pull requests require this gate before merge; nightly
# and manual runs also detect dependency or external-tool drift.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # The all-features workspace links hundreds of test binaries. These
  # artifacts are not needed for release-behavior validation and otherwise
  # exhaust an ephemeral hosted runner's disk.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  validate:
    name: Full repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # `uuidv7()` is a PostgreSQL 18 built-in used by current migrations and
      # integration tests. Port 5433 matches the documented test default.
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: melodee
          POSTGRES_PASSWORD: melodee-dev
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U melodee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Never alter these optional-tool paths on a self-hosted runner.
      - name: Free GitHub-hosted runner disk space
        if: runner.environment == 'github-hosted'
        run: sudo -E python3 scripts/ci_tasks.py free-space
        env:
          MELODEE_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      - name: Install pinned Rust toolchain
        run: python3 scripts/ci_tasks.py toolchain
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: admin-ui/package.json
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml

      - name: Install media inspection tools
        run: python3 scripts/ci_tasks.py media-tools
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Run full gate
        run: python3 scripts/check.py full
