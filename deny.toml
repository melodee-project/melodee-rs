[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"

[licenses]
version = 2
confidence-threshold = 0.93
# Keep the pre-approved FOSS license list stable: an allowance that no current
# dependency uses (e.g. BSD-2-Clause today) is a deliberate forward
# pre-approval, not a configuration error. Advisories/bans/sources still fail
# closed on unknown licenses.
unused-allowed-license = "allow"
allow = [
  # 0BSD: OSI-approved public-domain-equivalent; pulled in by quoted_printable
  # via lettre (notification SMTP transport, PRD-NOTIF-002).
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "PostgreSQL",
  "Unicode-3.0",
  "Zlib",
]

[bans]
# Multiple major versions are expected in this graph: sqlx/rustls/rand pull
# distinct major lines (e.g. base64 0.21+0.22, getrandom 0.2/0.3/0.4) that
# cannot be unified without risky feature-flag changes. Duplicate versions are
# therefore allowed; advisories, bans on wildcards, licences, and sources stay
# enforced. Review this list when upgrading the driver/crypto stack.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/sphildreth/decentdb"]
