name: melodee-rs-dev

# Defaults for the host-run server, read by scripts/dev_stack.py (make up).
# Root .env and exported variables override these, including an empty allowlist.
x-melodee-server-environment:
  MELODEE__OPENSUBSONIC__CORS__ALLOWED_ORIGINS: https://feishin.vercel.app

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: melodee
      POSTGRES_USER: melodee
      POSTGRES_PASSWORD: melodee-dev
    ports:
      # 5433 on host to avoid colliding with a host/other-project Postgres on 5432.
      - "5433:5432"
    volumes:
      # postgres:18+ images manage data in versioned subdirs; mount the parent dir.
      - melodee_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melodee -d melodee"]
      interval: 5s
      timeout: 5s
      retries: 20
    # PostgreSQL 18 uses large dynamic shared-memory segments for parallel
    # redo/query work (observed 128–256MB each); 512mb is exhausted under the
    # full test gate's parallel load and even blocks crash recovery.
    shm_size: 2gb

volumes:
  melodee_pg_data:
